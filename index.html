<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash-Flow</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="logo-section">
            <div class="logo">₹</div>
            <div class="title">
                <h1>Cash-Flow</h1>
                <p>Salary & expense tracker</p>
            </div>
        </div>
        <div class="date-section">
            <span class="calender">📅</span>
            <span id="current-date"></span>
        </div>
    </header>
    <main class="dashboard">
        <section class="left-panel">
            <div class="salary-card">
                <h2>Set your salary</h2>
                <form id="salaryForm">
                    <label for="salary">Total Salary (₹)</label>
                    <input type="number" id="salary" placeholder="Enter your salary">
                    <p id="salaryError" class="error"></p>
                    <button type="submit">Set salary</button>
                </form>
            </div>
            <div class="expense-card">
                <h2>Add Expense</h2>
                <form id="expenseForm">
                    <label for="expenseName">Expense Name</label>
                    <input type="text" id="expenseName" placeholder="Example: Rent">
                    <p id="expenseNameError" class="error"></p>
                    <label for="expenseAmount">Expense Amount</label>
                    <input type="number" id="expenseAmount" placeholder="Enter amount">
                    <p id="expenseAmountError" class="error"></p>
                    <button type="submit">Add expense</button>
                </form>
            </div>
        </section>
        <section class="right-panel">
            <div class="summary-cards">
                <div class="summary-card">
                    <h3>Total salary</h3>
                    <p id="salaryDisplay">₹0</p>
                </div>

                <div class="summary-card">
                    <h3>Total Expenses</h3>
                    <p id="expenseDisplay">₹0</p>
                </div>

                <div class="summary-card">
                    <h3>Remaining Balance</h3>
                    <p id="balanceDisplay">₹0</p>
                </div>
            </div>
            
            <div class="expense-history">
                <div class="history-header">
                    <h2>Expense History</h2>
                </div>

                <div id="expenseList">
                    <div class="expense-item"></div>
                    <div class="expense-item">
                    </div>
                </div>
            </div>
            <div class="chart-card">
              <h2>Financial Overview</h2>
              <canvas id="expenseChart"></canvas>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="index.js"></script>
</body>
</html>
